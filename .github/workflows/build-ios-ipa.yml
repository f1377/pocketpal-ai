name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install JS dependencies
        run: yarn install

      - name: Create Env.xcconfig
        run: |
          mkdir -p ios/Config

          cat > ios/Config/Env.xcconfig << 'EOF'
          GOOGLE_WEB_CLIENT_ID = dummy-web-client-id.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.dummy-ios-client-id
          EOF

      - name: Create dummy env
        run: |
          cat > .env << 'EOF'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOF

      - name: Create dummy GoogleService-Info.plist
        run: |
          cat > ios/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CLIENT_ID</key>
              <string>dummy-client-id.apps.googleusercontent.com</string>
              <key>REVERSED_CLIENT_ID</key>
              <string>com.googleusercontent.apps.dummy-client-id</string>
              <key>API_KEY</key>
              <string>dummy-api-key</string>
              <key>GCM_SENDER_ID</key>
              <string>000000000000</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>ai.pocketpal</string>
              <key>PROJECT_ID</key>
              <string>dummy-project</string>
              <key>STORAGE_BUCKET</key>
              <string>dummy-project.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false/>
              <key>IS_ANALYTICS_ENABLED</key>
              <false/>
              <key>IS_APPINVITE_ENABLED</key>
              <false/>
              <key>IS_GCM_ENABLED</key>
              <true/>
              <key>IS_SIGNIN_ENABLED</key>
              <true/>
              <key>GOOGLE_APP_ID</key>
              <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOF

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build for iPhone
        run: |
          set -o pipefail

          xcodebuild \
            -workspace ios/PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build

      - name: Create IPA
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/PocketPal.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "PocketPal.app not found"
            find ios/build/Build/Products -maxdepth 3 -type d -name "*.app" || true
            exit 1
          fi

          rm -rf Payload PocketPal-local-api.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/PocketPal.app

          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            PocketPal-local-api.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-local-api
          path: PocketPal-local-api.ipa